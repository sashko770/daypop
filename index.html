<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        // Intercept console.error for sandbox Vite HMR WebSocket notices
        const origConsoleError = console.error;
        console.error = function (...args) {
          const msg = args
            .map((a) => (a && (a.message || a.stack) ? a.message + ' ' + a.stack : String(a)))
            .join(' ');
          if (
            msg.includes('WebSocket') ||
            msg.includes('ws://') ||
            msg.includes('wss://') ||
            msg.includes('[vite]') ||
            msg.includes('closed without opened')
          ) {
            return;
          }
          origConsoleError.apply(console, args);
        };

        // Gracefully ignore sandbox Vite HMR WebSocket errors
        window.addEventListener(
          'error',
          function (e) {
            const msg = (e && (e.message || (e.error && e.error.message))) || '';
            if (
              msg.includes('WebSocket') ||
              msg.includes('ws://') ||
              msg.includes('wss://') ||
              msg.includes('closed without opened')
            ) {
              e.stopImmediatePropagation();
              e.preventDefault();
              return true;
            }
          },
          true
        );

        window.addEventListener(
          'unhandledrejection',
          function (e) {
            const reasonStr =
              (e && e.reason && (e.reason.message || e.reason.stack || String(e.reason))) || '';
            if (
              reasonStr.includes('WebSocket') ||
              reasonStr.includes('closed without opened') ||
              reasonStr.includes('ws://') ||
              reasonStr.includes('wss://')
            ) {
              e.stopImmediatePropagation();
              e.preventDefault();
              return true;
            }
          },
          true
        );
      })();
    </script>
